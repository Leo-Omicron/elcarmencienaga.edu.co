name: Validate DEMOS candidate
on:
  pull_request:
    paths:
      - 'demos/**'
      - 'scripts/check_demos.py'
      - '.github/workflows/check-demos.yml'
  push:
    branches: ['demos/**']
    paths:
      - 'demos/**'
      - 'scripts/check_demos.py'
      - '.github/workflows/check-demos.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_demos.py
